name: CI
on:
  pull_request:
  push: { branches: [main] }

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16 # same major version as production (Test Plan section 8)
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: backend/package-lock.json,
          }
      - run: npm ci
      - name: "Unit and integration tests with coverage (NFR-08: lines >= 70%)"
        run: npm test
        env:
          {
            NODE_ENV: test,
            TEST_ADMIN_URL: "postgres://postgres:postgres@localhost:5432/postgres",
          }
      - name: Dependency audit (no high or critical issues)
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: backend/coverage/lcov-report }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  # Docker + Docker Hub: after tests pass on main, build both images and push them to Docker Hub.
  # Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token).
  docker:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/peerlearn-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/peerlearn-api:latest
      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/peerlearn-web:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/peerlearn-web:latest

  # Kubernetes: start a throwaway cluster (kind), deploy the images just pushed to Docker Hub,
  # and log in through nginx over HTTPS to prove the whole stack works.
  kubernetes:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: peerlearn
      - name: Use the images built for this commit
        run: |
          sed -i "s#DOCKERHUB_USERNAME#${{ secrets.DOCKERHUB_USERNAME }}#g; s#newTag: latest#newTag: ${{ github.sha }}#g" k8s/kustomization.yaml
      - name: Demo secrets and a self-signed certificate (throwaway cluster only)
        run: cp .env.example .env && sh infra/gen-certs.sh
      - name: Deploy to Kubernetes
        run: sh k8s/deploy.sh
      - name: Smoke test through nginx over HTTPS
        run: |
          kubectl -n peerlearn port-forward service/web 8443:443 > /dev/null 2>&1 &
          sleep 5
          curl -skf https://localhost:8443/ | grep -q "<title>PeerLearn</title>"
          curl -skf -X POST https://localhost:8443/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@pes.edu","password":"ChangeMe-Admin-1"}' | grep -q '"token"'
          echo "Frontend and API respond through Kubernetes"
      - name: Show cluster state if anything failed
        if: failure()
        run: |
          kubectl -n peerlearn get all
          kubectl -n peerlearn describe pods | tail -n 80
          kubectl -n peerlearn logs job/migrate --all-containers || true
          kubectl -n peerlearn logs deployment/api --all-containers || true
