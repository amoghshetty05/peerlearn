name: CI
on:
  pull_request:
  push: { branches: [main] }

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16 # same major version as production (Test Plan section 8)
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: backend/package-lock.json,
          }
      - run: npm ci
      - name: "Unit and integration tests with coverage (NFR-08: lines >= 70%)"
        run: npm test
        env:
          {
            NODE_ENV: test,
            TEST_ADMIN_URL: "postgres://postgres:postgres@localhost:5432/postgres",
          }
      # Production packages only: picomatch (used only by the jest and vite build tools) has a
      # high advisory with no fixed version yet, and it never ships in the running app.
      - name: Dependency audit of production packages (no high or critical issues)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: backend/coverage/lcov-report }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci
      - run: npm run build
      - name: Dependency audit of production packages (no high or critical issues)
        run: npm audit --omit=dev --audit-level=high

  # Smart Match model service (FR-16): check that all six models load, predict valid chances and
  # reject bad input (TC-29), and that the test results meet the bar in models/metrics.json.
  ml:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ml/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: "Model service tests (TC-29)"
        run: python -m pytest -v
        env: { KERAS_BACKEND: jax }
      - name: "MLflow holds 2 machine learning, 2 deep learning and 2 quantum runs"
        run: python compare.py --check
      # DVC: the committed data and models must be exactly what the pipeline in dvc.yaml produces
      # from the committed code and params.yaml (hashes in dvc.lock). Fails if someone changes the
      # code or parameters without rerunning  dvc repro.
      - name: "DVC pipeline is up to date (dvc status)"
        run: |
          dvc status
          dvc status --quiet
      - name: "DVC metrics (test scores of every model)"
        run: dvc metrics show --md

  # Playwright end-to-end tests (TC-21 to TC-28): start the whole stack with Docker Compose and
  # drive a real Chromium browser through it over HTTPS. The HTML report is kept as an artifact.
  e2e:
    needs: [backend, frontend, ml]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Demo secrets and a self-signed certificate (CI only)
        run: cp .env.example .env && sh infra/gen-certs.sh
      - name: Start the full stack (db, migrate, api, web)
        run: docker compose up --build -d
      - name: Wait until nginx, the API and the model service answer
        run: |
          for i in $(seq 1 60); do
            if curl -skf -X POST https://localhost/api/auth/login -H "Content-Type: application/json" \
                 -d '{"email":"admin@pes.edu","password":"ChangeMe-Admin-1"}' | grep -q '"token"' \
               && docker compose exec -T api wget -qO- http://ml:8000/health | grep -q '"models":6'; then
              echo "Stack is up"; exit 0
            fi
            sleep 3
          done
          docker compose ps; docker compose logs --tail=80; exit 1
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: e2e/package-lock.json,
          }
      - name: Install Playwright and Chromium
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run the Playwright tests
        working-directory: e2e
        run: npx playwright test
        env:
          {
            BASE_URL: "https://localhost",
            HTTP_URL: "http://localhost",
            ADMIN_EMAIL: "admin@pes.edu",
            ADMIN_PASSWORD: "ChangeMe-Admin-1",
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: e2e/playwright-report }
      - name: Show container logs if anything failed
        if: failure()
        run: docker compose logs --tail=150

  # Docker + Docker Hub: after tests pass on main, build both images and push them to Docker Hub.
  # Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token).
  docker:
    needs: [backend, frontend, ml, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/peerlearn-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/peerlearn-api:latest
      - name: Build and push the Smart Match model image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ml/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/peerlearn-ml:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/peerlearn-ml:latest
      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/peerlearn-web:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/peerlearn-web:latest

  # Kubernetes: start a throwaway cluster (kind), deploy the images just pushed to Docker Hub,
  # and log in through nginx over HTTPS to prove the whole stack works.
  kubernetes:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: peerlearn
      - name: Use the images built for this commit
        run: |
          sed -i "s#DOCKERHUB_USERNAME#${{ secrets.DOCKERHUB_USERNAME }}#g; s#newTag: latest#newTag: ${{ github.sha }}#g" k8s/kustomization.yaml
      - name: Demo secrets and a self-signed certificate (throwaway cluster only)
        run: cp .env.example .env && sh infra/gen-certs.sh
      - name: Deploy to Kubernetes
        run: sh k8s/deploy.sh
      - name: Smoke test through nginx over HTTPS
        run: |
          kubectl -n peerlearn port-forward service/web 8443:443 > /dev/null 2>&1 &
          sleep 5
          curl -skf https://localhost:8443/ | grep -q "<title>PeerLearn</title>"
          curl -skf -X POST https://localhost:8443/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@pes.edu","password":"ChangeMe-Admin-1"}' | grep -q '"token"'
          kubectl -n peerlearn exec deployment/api -- wget -qO- http://ml:8000/health | grep -q '"models":6'
          echo "Frontend, API and Smart Match model service respond through Kubernetes"
      - name: Show cluster state if anything failed
        if: failure()
        run: |
          kubectl -n peerlearn get all
          kubectl -n peerlearn describe pods | tail -n 80
          kubectl -n peerlearn logs job/migrate --all-containers || true
          kubectl -n peerlearn logs deployment/api --all-containers || true
