name: CI
on:
  pull_request:
  push: { branches: [main] }

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16        # same major version as production (Test Plan section 8)
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - name: Unit and integration tests with coverage (NFR-08: lines >= 70%)
        run: npm test
        env: { NODE_ENV: test, TEST_ADMIN_URL: "postgres://postgres:postgres@localhost:5432/postgres" }
      - name: Dependency audit (no high or critical issues)
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: backend/coverage/lcov-report }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
