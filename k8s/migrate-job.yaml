# One-off job: applies db/schema.sql, creates the restricted app role (SR-07) and the first Admin.
# Jobs cannot be changed once created, so k8s/deploy.sh deletes the old one before each deploy.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h db -U postgres -d peerlearn; do echo waiting for db; sleep 2; done"]
      containers:
        - name: migrate
          image: peerlearn-api
          command: ["sh", "-c", "node scripts/migrate.js && node scripts/seed-admin.js"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: peerlearn-secrets, key: POSTGRES_PASSWORD } }
            - name: DATABASE_ADMIN_URL
              value: postgres://postgres:$(POSTGRES_PASSWORD)@db:5432/peerlearn
            - name: APP_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: peerlearn-secrets, key: APP_DB_PASSWORD } }
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: peerlearn-secrets, key: ADMIN_EMAIL } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: peerlearn-secrets, key: ADMIN_PASSWORD } }
