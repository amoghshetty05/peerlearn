# One command demo: ./infra/gen-certs.sh && cp .env.example .env && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: peerlearn
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d peerlearn"], interval: 3s, retries: 20 }

  migrate:                       # applies schema, creates the restricted app role, seeds the admin
    build: { context: ., dockerfile: backend/Dockerfile }
    command: sh -c "node scripts/migrate.js && node scripts/seed-admin.js"
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/peerlearn
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://peerlearn_app:${APP_DB_PASSWORD}@db:5432/peerlearn   # no UPDATE/DELETE on audit_log
      JWT_SECRET: ${JWT_SECRET}
      ENFORCE_HTTPS: "true"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      MAIL_FROM: ${MAIL_FROM}
    depends_on: { migrate: { condition: service_completed_successfully }, mailhog: { condition: service_started } }

  web:                           # nginx: TLS 1.2+, HTTP->HTTPS redirect, static SPA, /api proxy
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["80:80", "443:443"]
    volumes: ["./infra/certs:/etc/nginx/certs:ro"]
    depends_on: [api]

  mailhog:                       # catches outgoing email for the demo: http://localhost:8025
    image: mailhog/mailhog
    ports: ["8025:8025"]

volumes: { dbdata: {} }
